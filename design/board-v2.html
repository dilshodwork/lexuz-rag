<!DOCTYPE html>
<html lang="uz"><head><meta charset="UTF-8"><title>Doska v2</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #E6E3E0; font: 15px/1.4 -apple-system, Onest, sans-serif; color: #1c1517; padding: 30px 36px 36px; width: 1860px; }
body.dark { background: #1A1718; color: #f3eeee; }
h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -0.02em; }
p.sub { margin: 0 0 20px; opacity: .7; }
.row { display: flex; gap: 28px; align-items: flex-start; margin-bottom: 28px; }
figure { margin: 0; }
figcaption { font-size: 13px; font-weight: 600; margin-bottom: 8px; opacity: .75; }
.desk { width: 878px; height: 549px; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.12), 0 24px 50px -20px rgba(0,0,0,.35); }
.desk iframe { width: 1440px; height: 900px; border: 0; transform: scale(.6097); transform-origin: 0 0; }
.phone { width: 320px; height: 693px; border-radius: 44px; overflow: hidden; background: #000; box-shadow: 0 0 0 8px #111, 0 0 0 9px #333, 0 24px 50px -20px rgba(0,0,0,.45); margin: 9px; }
.phone iframe { width: 390px; height: 844px; border: 0; transform: scale(.8205); transform-origin: 0 0; }
</style></head>
<body>
<h1 id="t"></h1><p class="sub" id="s"></p>
<div class="row" id="r1"></div>
<div class="row" id="r2"></div>
<script>
const P = new URLSearchParams(location.search), d = P.get('d') || 'a', th = P.get('theme') || 'light';
if (th === 'dark') document.body.classList.add('dark');
t.textContent = (d === 'a' ? 'A · Anor' : 'B · Firuza') + (th === 'dark' ? ' · qorongʻi rejim' : '') + ' · v2 (sayt + telefon)';
s.textContent = 'Bitta kod: 1024 px dan keng ekranda sayt (yon panel, chat, manbalar inspektori), torroq ekranda va Telegram Mini App ichida iOS uslubidagi telefon ilovasi.';
const u = q => `maket-v2.html?d=${d}&theme=${th}${q}`;
r1.innerHTML = [['Sayt · bosh sahifa', ''], ['Sayt · [2] bosilgan, manba yoritilgan', '&view=cite']].map(([c, q]) => `<figure><figcaption>${c}</figcaption><div class="desk"><iframe src="${u(q)}"></iframe></div></figure>`).join('');
r2.innerHTML = [['Bosh sahifa', ''], ['Javob', '&view=scrolled'], ['[2] → varaq (medium)', '&view=cite'], ['Varaq (large), orqa fon karta', '&view=large'], ['Filtrlar', '&view=filters']].map(([c, q]) => `<figure><figcaption>${c}</figcaption><div class="phone"><iframe src="${u(q)}"></iframe></div></figure>`).join('');
</script>
</body></html>
